<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Quiz PRO</title>

<style>

body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff6a00,#ff00cc,#00f2ff,#00ff88);
background-size:400% 400%;
animation:bgMove 6s infinite alternate;
overflow:hidden;
}

@keyframes bgMove{
0%{background-position:left}
100%{background-position:right}
}

.card{
width:92%;
max-width:520px;
background:white;
border-radius:20px;
padding:18px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
position:relative;
}

.topbar{
display:flex;
justify-content:space-between;
font-weight:bold;
margin-bottom:10px;
flex-wrap:wrap;
gap:5px;
}

.title{
font-size:24px;
font-weight:bold;
margin:10px 0;
color:#6a11cb;
}

.btn{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
transition:0.25s;
}

.btn:hover{
transform:scale(1.05);
}

.p1{background:#ffe066;}
.p2{background:#2ed573;}
.p3{background:#1e90ff;color:white;}
.p4{background:#ff4757;color:white;}

.hidden{
display:none;
}

.progressBox{
width:100%;
height:14px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:12px;
}

#progressBar{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ff88,#00ccff);
transition:0.4s;
}

#badge{
font-size:18px;
font-weight:bold;
color:#ff4757;
margin-bottom:10px;
}

.avatarBox{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:12px;
flex-wrap:wrap;
}

.avatar{
font-size:35px;
padding:10px;
border-radius:50%;
cursor:pointer;
background:#eee;
transition:0.3s;
}

.avatar:hover{
transform:scale(1.2);
background:#ffe066;
}

.levelLocked{
opacity:0.4;
pointer-events:none;
}

.rewardPopup{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:#2ed573;
color:white;
padding:15px 25px;
border-radius:15px;
font-size:20px;
font-weight:bold;
z-index:999;
animation:pop 2s forwards;
}

@keyframes pop{
0%{transform:translateX(-50%) scale(0)}
20%{transform:translateX(-50%) scale(1)}
80%{transform:translateX(-50%) scale(1)}
100%{transform:translateX(-50%) scale(0)}
}

#confetti{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="card">

<div class="topbar">
<div>⭐ <span id="stars">0</span></div>
<div>🪙 <span id="coins">0</span></div>
<div>❤️ <span id="lives">3</span></div>
<div>🔥 <span id="streak">0</span></div>
<div>⏱️ <span id="time">10</span></div>
</div>

<div class="progressBox">
<div id="progressBar"></div>
</div>

<div id="badge"></div>

<div class="title">🎮 Kids Quiz PRO</div>

<div class="avatarBox">
<div class="avatar" onclick="chooseAvatar('🐱')">🐱</div>
<div class="avatar" onclick="chooseAvatar('🦁')">🦁</div>
<div class="avatar" onclick="chooseAvatar('🐼')">🐼</div>
<div class="avatar" onclick="chooseAvatar('🐸')">🐸</div>
</div>

<h2 id="playerAvatar">😀</h2>

<div id="startScreen">
<button class="btn p1" onclick="startApp()">🔊 Tap to Start</button>
</div>

<div id="catScreen" class="hidden">
<button class="btn p2" onclick="selectCat('math')">Math</button>
<button class="btn p3" onclick="selectCat('english')">English</button>
<button class="btn p4" onclick="selectCat('gk')">GK</button>
<button class="btn p1" onclick="goHome()">🏠 Restart</button>
</div>

<div id="levelScreen" class="hidden">
<button class="btn p1" onclick="selectLevel(0)">Easy</button>
<button class="btn p2" onclick="selectLevel(1)">Medium</button>
<button class="btn p3" onclick="selectLevel(2)">Hard</button>
<button class="btn p4" onclick="show('catScreen')">⬅ Back</button>
</div>

<div id="gameScreen" class="hidden">
<h3 id="q"></h3>
<div id="opts"></div>

<button class="btn p2" onclick="prevQ()">⬅ Prev</button>
<button class="btn p3" onclick="nextQ()">Next ➡</button>
<button class="btn p4" onclick="goHome()">🏠 Home</button>
</div>

</div>

<script>

/* SOUND */
function playSound(src){
new Audio(src).play().catch(()=>{});
}

/* VOICE */
function speak(text){
speechSynthesis.cancel();
text=text.replace(/__+/g," dash ");
let msg=new SpeechSynthesisUtterance(text);
speechSynthesis.speak(msg);
}

/* START */
function startApp(){
playSound("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
setTimeout(()=>speak("Welcome to Kids Quiz Pro"),200);
show("catScreen");
}

/* VARIABLES */
let cat="",level=0,i=0,stars=0,coins=0,timer,time=10;
let lives=3;
let streak=0;
let unlockedLevels=[true,false,false];
let avatar="😀";

/* SAVE SYSTEM */
function saveGame(){
localStorage.setItem("kidsQuizStars",stars);
localStorage.setItem("kidsQuizCoins",coins);
localStorage.setItem("kidsQuizLevels",JSON.stringify(unlockedLevels));
localStorage.setItem("kidsQuizAvatar",avatar);
}

function loadSave(){

stars=parseInt(localStorage.getItem("kidsQuizStars"))||0;
coins=parseInt(localStorage.getItem("kidsQuizCoins"))||0;

let lv=localStorage.getItem("kidsQuizLevels");

if(lv){
unlockedLevels=JSON.parse(lv);
}

avatar=localStorage.getItem("kidsQuizAvatar")||"😀";

document.getElementById("playerAvatar").innerText=avatar;

update();
updateLevels();
}

window.onload=()=>{
loadSave();
dailyReward();
};

/* DAILY REWARD */
function dailyReward(){

coins+=50;
update();

let pop=document.createElement("div");

pop.className="rewardPopup";
pop.innerText="🎁 Daily Reward +50 Coins!";

document.body.appendChild(pop);

setTimeout(()=>{
pop.remove();
},2000);

saveGame();
}

/* AVATAR */
function chooseAvatar(a){
avatar=a;
document.getElementById("playerAvatar").innerText=a;
saveGame();
}

/* LEVEL LOCK */
function updateLevels(){

let buttons=document.querySelectorAll("#levelScreen .btn");

buttons[0].classList.remove("levelLocked");

if(unlockedLevels[1]){
buttons[1].classList.remove("levelLocked");
}else{
buttons[1].classList.add("levelLocked");
}

if(unlockedLevels[2]){
buttons[2].classList.remove("levelLocked");
}else{
buttons[2].classList.add("levelLocked");
}
}

/* QUESTIONS */
const data={

math:[
[
{q:"2+2?",o:["4","5","6","7"],a:0},
{q:"3+4?",o:["7","6","5","8"],a:0},
{q:"5+5?",o:["10","11","9","12"],a:0}
],

[
{q:"12+8?",o:["20","18","19","17"],a:0},
{q:"15-5?",o:["10","9","8","7"],a:0},
{q:"9×2?",o:["18","16","14","12"],a:0}
],

[
{q:"12×12?",o:["144","124","134","154"],a:0},
{q:"144÷12?",o:["12","11","10","13"],a:0},
{q:"100-45?",o:["55","50","60","65"],a:0}
]
],

english:[
[
{q:"Opposite of hot?",o:["Cold","Warm","Fire","Heat"],a:0},
{q:"Plural of cat?",o:["Cats","Cat","Cates","Caties"],a:0},
{q:"Sun rises in?",o:["East","West","North","South"],a:0}
],

[
{q:"He __ going",o:["is","are","am","be"],a:0},
{q:"They __ playing",o:["are","is","am","be"],a:0},
{q:"We __ happy",o:["are","is","am","be"],a:0}
],

[
{q:"Past of go?",o:["Went","Goed","Going","Gone"],a:0},
{q:"Past of eat?",o:["Ate","Eat","Eating","Eated"],a:0},
{q:"Past of see?",o:["Saw","Seen","See","Seeing"],a:0}
]
],

gk:[
[
{q:"Capital of India?",o:["Delhi","Mumbai","Goa","Chennai"],a:0},
{q:"Largest ocean?",o:["Pacific","Atlantic","Indian","Arctic"],a:0},
{q:"How many days week?",o:["7","6","5","8"],a:0}
],

[
{q:"Boiling point water?",o:["100°C","50°C","0°C","200°C"],a:0},
{q:"Gas?",o:["Oxygen","Iron","Water","Stone"],a:0},
{q:"Plant makes food?",o:["Photosynthesis","Breathing","Jump","Run"],a:0}
],

[
{q:"1 KB=?",o:["1024 bytes","100","10","1"],a:0},
{q:"Gravity by?",o:["Newton","Einstein","Tesla","Darwin"],a:0},
{q:"DNA is?",o:["Genetic","Metal","Gas","Liquid"],a:0}
]
]

};

/* LOAD QUESTION */
function load(){

let q=data[cat][level][i];

document.getElementById("q").innerText=q.q;

speak(q.q);

let options=q.o
.map((t,idx)=>({t,ok:idx===q.a}))
.sort(()=>Math.random()-0.5);

document.getElementById("opts").innerHTML=
options.map(op=>
`<button class="btn p1" onclick="check(this,${op.ok})">${op.t}</button>`
).join("");

startTimer();
updateProgress();
}

/* CHECK ANSWER */
function check(btn,ok){

clearInterval(timer);

if(ok){

btn.style.background="#2ed573";

stars++;
coins+=10;
streak++;

playSound("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

blastConfetti();

if(streak>=5){
document.getElementById("badge").innerText="🏅 Quiz Master!";
coins+=50;
}

}else{

btn.style.background="#ff4757";

lives--;
streak=0;

playSound("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");

if(lives<=0){
alert("💀 Game Over!");
goHome();
return;
}
}

update();
saveGame();

setTimeout(nextQ,700);
}

/* PREV */
function prevQ(){

if(i>0){

i--;

stars=Math.max(0,stars-1);

update();

load();
}
}

/* NEXT */
function nextQ(){

updateProgress();

if(i<data[cat][level].length-1){

i++;

load();

}else{

if(level===0) unlockedLevels[1]=true;
if(level===1) unlockedLevels[2]=true;

saveGame();

updateLevels();

alert("🏆 Level Completed!");

goHome();
}
}

/* UPDATE */
function update(){

document.getElementById("stars").innerText=stars;
document.getElementById("coins").innerText=coins;
document.getElementById("lives").innerText=lives;
document.getElementById("streak").innerText=streak;
}

/* PROGRESS */
function updateProgress(){

let total=data[cat][level].length;

let progress=((i+1)/total)*100;

document.getElementById("progressBar").style.width=progress+"%";
}

/* TIMER */
function startTimer(){

clearInterval(timer);

time=10;

document.getElementById("time").innerText=time;

timer=setInterval(()=>{

time--;

document.getElementById("time").innerText=time;

if(time<=0){

lives--;

update();

if(lives<=0){
alert("💀 Game Over!");
goHome();
}else{
nextQ();
}
}

},1000);
}

/* HOME */
function goHome(){

i=0;

clearInterval(timer);

show("catScreen");

saveGame();
}

/* SHOW SCREEN */
function show(id){

["startScreen","catScreen","levelScreen","gameScreen"]
.forEach(x=>
document.getElementById(x).classList.add("hidden")
);

document.getElementById(id).classList.remove("hidden");
}

/* CATEGORY */
function selectCat(c){

cat=c;

show("levelScreen");

updateLevels();
}

/* LEVEL */
function selectLevel(l){

if(!unlockedLevels[l]) return;

level=l;

i=0;

lives=3;

streak=0;

show("gameScreen");

update();

load();
}

/* CONFETTI */
const canvas=document.getElementById("confetti");

const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let confetti=[];

function blastConfetti(){

for(let i=0;i<60;i++){

confetti.push({

x:Math.random()*canvas.width,
y:-10,
r:Math.random()*6+2,
vx:(Math.random()-0.5)*2,
vy:Math.random()*3+3,

color:`hsl(${Math.random()*360},100%,50%)`

});
}
}

function drawConfetti(){

ctx.clearRect(0,0,canvas.width,canvas.height);

confetti.forEach(p=>{

ctx.fillStyle=p.color;

ctx.beginPath();

ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

ctx.fill();

p.x+=p.vx;

p.y+=p.vy;
});

confetti=confetti.filter(p=>p.y<canvas.height);

requestAnimationFrame(drawConfetti);
}

drawConfetti();

</script>

</body>
</html>
