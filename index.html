<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Quiz PRO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff6a00,#ff00cc,#00f2ff,#00ff88);
background-size:400% 400%;
animation:bgMove 8s infinite alternate;
}

@keyframes bgMove{
0%{background-position:left;}
100%{background-position:right;}
}

body{
display:flex;
justify-content:center;
align-items:center;
}

.card{
width:92%;
max-width:520px;
background:#fff;
border-radius:20px;
padding:18px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
position:relative;
z-index:5;
max-height:95vh;
overflow-y:auto;
}

.topbar{
display:flex;
justify-content:space-between;
font-weight:bold;
font-size:18px;
margin-bottom:10px;
flex-wrap:wrap;
}

.progressBox{
width:100%;
height:14px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:15px;
}

#progressBar{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ff88,#00c3ff);
transition:0.4s;
}

.title{
font-size:30px;
font-weight:bold;
margin:12px 0;
color:#6a11cb;
}

.btn{
width:100%;
padding:14px;
margin:7px 0;
border:none;
border-radius:14px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.25s;
}

.btn:hover{
transform:scale(1.03);
}

.p1{background:#ffe066;}
.p2{background:#2ed573;}
.p3{background:#1e90ff;color:white;}
.p4{background:#ff4757;color:white;}

.hidden{
display:none;
}

.avatarBox{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:12px;
flex-wrap:wrap;
}

.avatar{
font-size:35px;
padding:10px;
border-radius:50%;
background:#eee;
cursor:pointer;
transition:0.25s;
}

.avatar:hover{
transform:scale(1.15);
background:#ffe066;
}

#confetti{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:999;
}

</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="card">

<div class="topbar">
<div>⭐ <span id="stars">0</span></div>
<div>🪙 <span id="coins">0</span></div>
<div>❤️ <span id="lives">3</span></div>
<div>🔥 <span id="streak">0</span></div>
<div>⏱️ <span id="time">10</span></div>
</div>

<div class="progressBox">
<div id="progressBar"></div>
</div>

<div class="title">🎮 Smart Kids Quiz</div>

<div class="avatarBox">
<div class="avatar" onclick="chooseAvatar('🐱')">🐱</div>
<div class="avatar" onclick="chooseAvatar('🦁')">🦁</div>
<div class="avatar" onclick="chooseAvatar('🐼')">🐼</div>
<div class="avatar" onclick="chooseAvatar('🐸')">🐸</div>
</div>

<h2 id="playerAvatar">😀</h2>

<div id="startScreen">
<button class="btn p1" onclick="startApp()">🔊 Tap To Start</button>
</div>

<div id="catScreen" class="hidden">

<button class="btn p2" onclick="selectCat('math')">Math</button>
<button class="btn p3" onclick="selectCat('english')">English</button>
<button class="btn p4" onclick="selectCat('gk')">GK</button>
<button class="btn p1" onclick="resetGame()">🔄 Full Restart</button>

</div>

<div id="levelScreen" class="hidden">

<button class="btn p1" onclick="selectLevel(0)">Easy</button>
<button class="btn p2" onclick="selectLevel(1)">Medium</button>
<button class="btn p3" onclick="selectLevel(2)">Hard</button>
<button class="btn p4" onclick="show('catScreen')">⬅ Back</button>

</div>

<div id="gameScreen" class="hidden">

<h2 id="q"></h2>
<div id="opts"></div>

<button class="btn p2" onclick="prevQ()">⬅ Prev</button>
<button class="btn p1" onclick="goHome()">🏠 Home</button>
<button class="btn p3" onclick="nextQ()">Next ➡</button>

</div>

</div>

<script>

/* VARIABLES */
let cat="";
let level=0;
let i=0;

let stars=0;
let coins=0;
let lives=3;
let streak=0;

let timer;
let time=10;

let avatar="😀";

/* SOUNDS */
const correctSound=new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
const wrongSound=new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
const startSound=new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

/* SPEAK */
function speak(text){
speechSynthesis.cancel();
let msg=new SpeechSynthesisUtterance(text);
speechSynthesis.speak(msg);
}

/* START */
function startApp(){
startSound.play();
speak("Welcome to Smart Kids Quiz");
show("catScreen");
}

/* SAVE */
function saveGame(){
localStorage.setItem("quizStars",stars);
localStorage.setItem("quizCoins",coins);
localStorage.setItem("quizAvatar",avatar);
}

/* LOAD */
function loadSave(){
stars=parseInt(localStorage.getItem("quizStars"))||0;
coins=parseInt(localStorage.getItem("quizCoins"))||0;
avatar=localStorage.getItem("quizAvatar")||"😀";
document.getElementById("playerAvatar").innerText=avatar;
update();
}

/* RESET */
function resetGame(){
localStorage.clear();
location.reload();
}

/* AVATAR */
function chooseAvatar(a){
avatar=a;
document.getElementById("playerAvatar").innerText=a;
saveGame();
}

/* QUESTIONS */
const data={
math:[
[
{q:"2+2?",o:["4","5","6","7"],a:0},
{q:"3+4?",o:["7","6","5","8"],a:0}
],
[
{q:"12+8?",o:["20","18","19","17"],a:0}
],
[
{q:"12×12?",o:["144","124","154","164"],a:0}
]
],

english:[
[
{q:"Opposite of hot?",o:["Cold","Warm","Heat","Fire"],a:0}
],
[
{q:"He __ going",o:["is","are","am","be"],a:0}
],
[
{q:"Past of go?",o:["Went","Goed","Gone","Going"],a:0}
]
],

gk:[
[
{q:"Capital of India?",o:["Delhi","Mumbai","Goa","Chennai"],a:0}
],
[
{q:"Boiling point of water?",o:["100°C","50°C","0°C","200°C"],a:0}
],
[
{q:"Gravity discovered by?",o:["Newton","Tesla","Einstein","Darwin"],a:0}
]
]
};

/* LOAD QUESTION */
function load(){

if(!data[cat] || !data[cat][level]) return;

let q=data[cat][level][i];

document.getElementById("q").innerText=q.q;
speak(q.q);

let options=q.o
.map((t,idx)=>({t,ok:idx===q.a}))
.sort(()=>Math.random()-0.5);

document.getElementById("opts").innerHTML=
options.map(op=>
`<button class="btn p1" onclick="check(this,${op.ok})">${op.t}</button>`
).join("");

updateProgress();
startTimer();
}

/* CHECK */
function check(btn,ok){

clearInterval(timer);

if(ok){
btn.style.background="#2ed573";
correctSound.play();
stars++;
coins+=10;
streak++;
blastConfetti();
}else{
btn.style.background="#ff4757";
wrongSound.play();
lives--;
streak=0;
if(lives<=0){
alert("Game Over");
goHome();
return;
}
}

update();
saveGame();
setTimeout(nextQ,800);
}

/* NEXT */
function nextQ(){
if(i<data[cat][level].length-1){
i++;
load();
}else{
alert("Level Completed!");
goHome();
}
}

/* PREV */
function prevQ(){
if(i>0){
i--;
coins=Math.max(0,coins-10);
stars=Math.max(0,stars-1);
update();
saveGame();
load();
}
}

/* UPDATE */
function update(){
document.getElementById("stars").innerText=stars;
document.getElementById("coins").innerText=coins;
document.getElementById("lives").innerText=lives;
document.getElementById("streak").innerText=streak;
}

/* TIMER */
function startTimer(){
clearInterval(timer);
time=10;
document.getElementById("time").innerText=time;

timer=setInterval(()=>{
time--;
document.getElementById("time").innerText=time;
if(time<=0){
clearInterval(timer);
nextQ();
}
},1000);
}

/* PROGRESS */
function updateProgress(){
let total=data[cat][level].length;
let progress=((i+1)/total)*100;
document.getElementById("progressBar").style.width=progress+"%";
}

/* SHOW */
function show(id){
["startScreen","catScreen","levelScreen","gameScreen"]
.forEach(x=>document.getElementById(x).classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

/* SELECT */
function selectCat(c){
cat=c;
show("levelScreen");
}

function selectLevel(l){
level=l;
i=0;
lives=3;
streak=0;
show("gameScreen");
load();
update();
}

/* HOME */
function goHome(){
clearInterval(timer);
saveGame();
show("catScreen");
}

/* CONFETTI */
const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let confetti=[];

function blastConfetti(){
for(let i=0;i<90;i++){
confetti.push({
x:canvas.width/2,
y:canvas.height/2,
r:Math.random()*6+2,
vx:(Math.random()-0.5)*12,
vy:(Math.random()-0.5)*12,
color:`hsl(${Math.random()*360},100%,50%)`
});
}
}

function drawConfetti(){
ctx.clearRect(0,0,canvas.width,canvas.height);

confetti.forEach(p=>{
ctx.fillStyle=p.color;
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();
p.x+=p.vx;
p.y+=p.vy;
p.vy+=0.1;
});

confetti=confetti.filter(p=>p.y<canvas.height);
requestAnimationFrame(drawConfetti);
}
drawConfetti();

/* INIT */
window.onload=function(){
loadSave();
show("startScreen");
};

</script>

</body>
</html>
