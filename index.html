<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Quiz PRO</title>

<style>

body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff6a00,#ff00cc,#00f2ff,#00ff88);
background-size:400% 400%;
animation:bgMove 6s infinite alternate;
overflow:hidden;
}

@keyframes bgMove{
0%{background-position:left}
100%{background-position:right}
}

.card{
width:92%;
max-width:520px;
background:white;
border-radius:20px;
padding:18px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
position:relative;
max-height:95vh;
overflow:auto;
}

.topbar{
display:flex;
justify-content:space-between;
font-weight:bold;
margin-bottom:10px;
flex-wrap:wrap;
gap:5px;
font-size:20px;
}

.title{
font-size:24px;
font-weight:bold;
margin:10px 0;
color:#6a11cb;
}

.btn{
width:100%;
padding:14px;
margin:6px 0;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
transition:0.25s;
font-weight:bold;
}

.btn:hover{
transform:scale(1.05);
}

.p1{background:#ffe066;}
.p2{background:#2ed573;}
.p3{background:#1e90ff;color:white;}
.p4{background:#ff4757;color:white;}

.hidden{
display:none;
}

.progressBox{
width:100%;
height:14px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:12px;
}

#progressBar{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ff88,#00ccff);
transition:0.4s;
}

#badge{
font-size:18px;
font-weight:bold;
color:#ff4757;
margin-bottom:10px;
}

.avatarBox{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:12px;
flex-wrap:wrap;
}

.avatar{
font-size:35px;
padding:10px;
border-radius:50%;
cursor:pointer;
background:#eee;
transition:0.3s;
}

.avatar:hover{
transform:scale(1.2);
background:#ffe066;
}

.levelLocked{
opacity:0.4;
pointer-events:none;
}

.rewardPopup{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:#2ed573;
color:white;
padding:15px 25px;
border-radius:15px;
font-size:20px;
font-weight:bold;
z-index:999;
animation:pop 2s forwards;
}

@keyframes pop{
0%{transform:translateX(-50%) scale(0)}
20%{transform:translateX(-50%) scale(1)}
80%{transform:translateX(-50%) scale(1)}
100%{transform:translateX(-50%) scale(0)}
}

#confetti{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:999;
}

</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="card">

<div class="topbar">
<div>⭐ <span id="stars">0</span></div>
<div>🪙 <span id="coins">0</span></div>
<div>❤️ <span id="lives">3</span></div>
<div>🔥 <span id="streak">0</span></div>
<div>⏱️ <span id="time">10</span></div>
</div>

<div class="progressBox">
<div id="progressBar"></div>
</div>

<div id="badge"></div>

<div class="title">🎮 Kids Quiz PRO</div>

<div class="avatarBox">
<div class="avatar" onclick="chooseAvatar('🐱')">🐱</div>
<div class="avatar" onclick="chooseAvatar('🦁')">🦁</div>
<div class="avatar" onclick="chooseAvatar('🐼')">🐼</div>
<div class="avatar" onclick="chooseAvatar('🐸')">🐸</div>
</div>

<h2 id="playerAvatar">😀</h2>

<div id="startScreen">
<button class="btn p1" onclick="startApp()">🔊 Tap to Start</button>
</div>

<div id="catScreen" class="hidden">

<button class="btn p2" onclick="selectCat('math')">Math</button>

<button class="btn p3" onclick="selectCat('english')">English</button>

<button class="btn p4" onclick="selectCat('gk')">GK</button>

<button class="btn p1" onclick="resetGame()">🔄 Full Restart</button>

</div>

<div id="levelScreen" class="hidden">

<button id="easyBtn" class="btn p1" onclick="selectLevel(0)">Easy</button>

<button id="mediumBtn" class="btn p2" onclick="selectLevel(1)">Medium 🔒</button>

<button id="hardBtn" class="btn p3" onclick="selectLevel(2)">Hard 🔒</button>

<button class="btn p4" onclick="show('catScreen')">⬅ Back</button>

</div>

<div id="gameScreen" class="hidden">

<h3 id="q"></h3>

<div id="opts"></div>

<button class="btn p2" onclick="prevQ()">⬅ Prev</button>

<button class="btn p1" onclick="goHome()">🏠 Home</button>

<button class="btn p3" onclick="nextQ()">Next ➡</button>

</div>

</div>

<script>

/* SOUND */
function playSound(src){
new Audio(src).play().catch(()=>{});
}

/* VOICE */
function speak(text){
speechSynthesis.cancel();
let msg=new SpeechSynthesisUtterance(text);
speechSynthesis.speak(msg);
}

/* START */
function startApp(){
playSound("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
speak("Welcome to Kids Quiz Pro");
show("catScreen");
}

/* VARIABLES */
let cat="",level=0,i=0;
let stars=0,coins=0;
let lives=3;
let streak=0;
let timer,time=10;
let avatar="😀";
let unlockedLevels=[true,false,false];

/* SAVE */
function saveGame(){

localStorage.setItem("quizStars",stars);
localStorage.setItem("quizCoins",coins);
localStorage.setItem("quizLevels",JSON.stringify(unlockedLevels));
localStorage.setItem("quizAvatar",avatar);

}

/* LOAD */
function loadSave(){

stars=parseInt(localStorage.getItem("quizStars"))||0;
coins=parseInt(localStorage.getItem("quizCoins"))||0;

let lv=localStorage.getItem("quizLevels");

if(lv){
unlockedLevels=JSON.parse(lv);
}

avatar=localStorage.getItem("quizAvatar")||"😀";

document.getElementById("playerAvatar").innerText=avatar;

update();
updateLevels();
}

/* DAILY REWARD */
function dailyReward(){

let today=new Date().toDateString();

let lastReward=localStorage.getItem("lastReward");

if(lastReward===today) return;

localStorage.setItem("lastReward",today);

coins+=50;

update();

let pop=document.createElement("div");

pop.className="rewardPopup";

pop.innerText="🎁 Daily Reward +50 Coins!";

document.body.appendChild(pop);

setTimeout(()=>{
pop.remove();
},2000);

saveGame();
}

/* RESET */
function resetGame(){

localStorage.clear();

stars=0;
coins=0;
lives=3;
streak=0;

unlockedLevels=[true,false,false];

update();

alert("Game Reset Complete!");

location.reload();
}

/* AVATAR */
function chooseAvatar(a){

avatar=a;

document.getElementById("playerAvatar").innerText=a;

saveGame();
}

/* LEVEL UPDATE */
function updateLevels(){

let medium=document.getElementById("mediumBtn");
let hard=document.getElementById("hardBtn");

medium.classList.add("levelLocked");
hard.classList.add("levelLocked");

medium.innerText="Medium 🔒";
hard.innerText="Hard 🔒";

if(unlockedLevels[1]){
medium.classList.remove("levelLocked");
medium.innerText="Medium";
}

if(unlockedLevels[2]){
hard.classList.remove("levelLocked");
hard.innerText="Hard";
}
}

/* QUESTIONS */
const data={

math:[
[
{q:"2+2?",o:["4","5","6","7"],a:0},
{q:"3+4?",o:["7","6","5","8"],a:0},
{q:"5+5?",o:["10","11","9","12"],a:0},
{q:"7+2?",o:["9","8","7","10"],a:0},
{q:"10-5?",o:["5","6","4","3"],a:0}
],

[
{q:"12+8?",o:["20","18","19","17"],a:0},
{q:"15-5?",o:["10","9","8","7"],a:0},
{q:"9×2?",o:["18","16","14","12"],a:0},
{q:"20÷4?",o:["5","4","6","3"],a:0},
{q:"7×3?",o:["21","18","24","20"],a:0}
],

[
{q:"12×12?",o:["144","124","154","164"],a:0},
{q:"144÷12?",o:["12","10","11","13"],a:0},
{q:"100-45?",o:["55","50","60","65"],a:0},
{q:"25×4?",o:["100","90","80","110"],a:0},
{q:"81÷9?",o:["9","8","7","6"],a:0}
]
],

english:[
[
{q:"Opposite of hot?",o:["Cold","Warm","Heat","Fire"],a:0},
{q:"Plural of cat?",o:["Cats","Cat","Cates","Caties"],a:0},
{q:"Sun rises in?",o:["East","West","North","South"],a:0},
{q:"Color of sky?",o:["Blue","Green","Yellow","Red"],a:0},
{q:"Baby dog?",o:["Puppy","Kitten","Cub","Calf"],a:0}
],

[
{q:"He __ going",o:["is","are","am","be"],a:0},
{q:"They __ playing",o:["are","is","am","be"],a:0},
{q:"We __ happy",o:["are","is","am","be"],a:0},
{q:"I __ ready",o:["am","is","are","be"],a:0},
{q:"She __ teacher",o:["is","are","am","be"],a:0}
],

[
{q:"Past of go?",o:["Went","Goed","Gone","Going"],a:0},
{q:"Past of eat?",o:["Ate","Eat","Eating","Eated"],a:0},
{q:"Past of see?",o:["Saw","Seen","See","Seeing"],a:0},
{q:"Past of run?",o:["Ran","Run","Runned","Running"],a:0},
{q:"Past of write?",o:["Wrote","Write","Writing","Writed"],a:0}
]
],

gk:[
[
{q:"Capital of India?",o:["Delhi","Mumbai","Goa","Chennai"],a:0},
{q:"Largest ocean?",o:["Pacific","Atlantic","Indian","Arctic"],a:0},
{q:"How many days in week?",o:["7","6","5","8"],a:0},
{q:"India currency?",o:["Rupee","Dollar","Euro","Yen"],a:0},
{q:"Sun is?",o:["Star","Planet","Moon","Rock"],a:0}
],

[
{q:"Boiling point water?",o:["100°C","50°C","0°C","200°C"],a:0},
{q:"Gas breathe?",o:["Oxygen","Nitrogen","Hydrogen","Carbon"],a:0},
{q:"Earth revolves around?",o:["Sun","Moon","Mars","Venus"],a:0},
{q:"Largest desert?",o:["Sahara","Gobi","Thar","Kalahari"],a:0},
{q:"National bird India?",o:["Peacock","Crow","Eagle","Sparrow"],a:0}
],

[
{q:"1 KB=?",o:["1024 bytes","100","10","1"],a:0},
{q:"Gravity by?",o:["Newton","Einstein","Tesla","Darwin"],a:0},
{q:"DNA is?",o:["Genetic","Metal","Gas","Liquid"],a:0},
{q:"Atom is?",o:["Smallest","Big","Huge","Medium"],a:0},
{q:"Unit power?",o:["Watt","Volt","Newton","Joule"],a:0}
]
]

};

/* LOAD QUESTION */
function load(){

let q=data[cat][level][i];

document.getElementById("q").innerText=q.q;

speak(q.q);

let options=q.o
.map((t,idx)=>({t,ok:idx===q.a}))
.sort(()=>Math.random()-0.5);

document.getElementById("opts").innerHTML=
options.map(op=>
`<button class="btn p1" onclick="check(this,${op.ok})">${op.t}</button>`
).join("");

updateProgress();

startTimer();
}

/* CHECK */
function check(btn,ok){

clearInterval(timer);

if(ok){

btn.style.background="#2ed573";

stars++;
coins+=10;
streak++;

blastConfetti();

playSound("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

if(streak>=5){

document.getElementById("badge").innerText="🏅 Quiz Master!";
coins+=50;
}

}else{

btn.style.background="#ff4757";

lives--;
streak=0;

playSound("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");

if(lives<=0){

alert("💀 Game Over!");

goHome();

return;
}
}

update();

saveGame();

setTimeout(nextQ,700);
}

/* NEXT */
function nextQ(){

if(i<data[cat][level].length-1){

i++;

load();

}else{

if(level===0){
unlockedLevels[1]=true;
}

if(level===1){
unlockedLevels[2]=true;
}

saveGame();

updateLevels();

alert("🏆 Level Completed!");

goHome();
}
}

/* PREV */
function prevQ(){

if(i>0){

i--;

load();
}
}

/* UPDATE */
function update(){

document.getElementById("stars").innerText=stars;
document.getElementById("coins").innerText=coins;
document.getElementById("lives").innerText=lives;
document.getElementById("streak").innerText=streak;
}

/* PROGRESS */
function updateProgress(){

let total=data[cat][level].length;

let progress=((i+1)/total)*100;

document.getElementById("progressBar").style.width=progress+"%";
}

/* TIMER */
function startTimer(){

clearInterval(timer);

time=10;

document.getElementById("time").innerText=time;

timer=setInterval(()=>{

time--;

document.getElementById("time").innerText=time;

if(time<=0){

lives--;

update();

if(lives<=0){

alert("💀 Game Over!");

goHome();

}else{

nextQ();
}
}

},1000);
}

/* SHOW */
function show(id){

["startScreen","catScreen","levelScreen","gameScreen"]
.forEach(x=>document.getElementById(x).classList.add("hidden"));

document.getElementById(id).classList.remove("hidden");
}

/* CATEGORY */
function selectCat(c){

cat=c;

show("levelScreen");

updateLevels();
}

/* LEVEL */
function selectLevel(l){

if(!unlockedLevels[l]) return;

level=l;

i=0;

lives=3;

streak=0;

document.getElementById("badge").innerText="";

show("gameScreen");

load();

update();
}

/* HOME */
function goHome(){

clearInterval(timer);

saveGame();

show("catScreen");
}

/* CONFETTI FRONT BURST */
const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let confetti=[];

function blastConfetti(){

for(let i=0;i<80;i++){

confetti.push({

x:canvas.width/2,
y:canvas.height/2,

r:Math.random()*6+2,

vx:(Math.random()-0.5)*12,

vy:(Math.random()-0.5)*12,

color:`hsl(${Math.random()*360},100%,50%)`

});
}
}

function drawConfetti(){

ctx.clearRect(0,0,canvas.width,canvas.height);

confetti.forEach(p=>{

ctx.fillStyle=p.color;

ctx.beginPath();

ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

ctx.fill();

p.x+=p.vx;

p.y+=p.vy;

p.vy+=0.1;

});

confetti=confetti.filter(p=>p.y<canvas.height);

requestAnimationFrame(drawConfetti);
}

drawConfetti();

/* STARTUP */
window.onload=()=>{

loadSave();

dailyReward();

};

</script>

</body>
</html>
