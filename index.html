<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Kids Quiz</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:90%;
max-width:400px;
background:white;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
color:#ff4d6d;
}

button{
padding:10px;
margin:5px;
border:none;
border-radius:8px;
background:#6c63ff;
color:white;
font-size:16px;
width:90%;
}

button:hover{
background:#574b90;
cursor:pointer;
}

.option{
display:block;
margin:8px 0;
background:#f1f1f1;
color:black;
}

.correct{background:#4CAF50 !important;color:white;}
.wrong{background:#f44336 !important;color:white;}

.hidden{display:none;}

</style>
</head>

<body>

<div class="container">

<h1>Smart Kids Quiz 🎨</h1>

<div id="menu">
<p>Choose Category</p>
<button onclick="startQuiz('math')">Math</button>
<button onclick="startQuiz('gk')">GK</button>
<button onclick="startQuiz('english')">English</button>
</div>

<div id="quiz" class="hidden">
<h2 id="question"></h2>
<div id="options"></div>
<p id="score"></p>
<button onclick="nextQuestion()">Next</button>
<button onclick="restart()">Restart</button>
</div>

</div>

<script>

const questions = {
math:[
{q:"2 + 2 = ?", a:["3","4","5","6"], correct:1},
{q:"5 x 3 = ?", a:["15","10","20","25"], correct:0}
],
gk:[
{q:"Capital of India?", a:["Mumbai","Delhi","Chennai","Kolkata"], correct:1},
{q:"Sun is a?", a:["Planet","Star","Moon","Comet"], correct:1}
],
english:[
{q:"Apple is a?", a:["Verb","Noun","Adjective","Adverb"], correct:1},
{q:"Cat is spelled?", a:["Kat","Cat","Cut","Cot"], correct:1}
]
};

let currentCategory;
let index = 0;
let score = 0;

function startQuiz(cat){
currentCategory = cat;
index = 0;
score = 0;
document.getElementById("menu").classList.add("hidden");
document.getElementById("quiz").classList.remove("hidden");
loadQuestion();
}

function loadQuestion(){
let q = questions[currentCategory][index];
document.getElementById("question").innerText = q.q;

let optionsDiv = document.getElementById("options");
optionsDiv.innerHTML = "";

q.a.forEach((opt,i)=>{
let btn = document.createElement("button");
btn.innerText = opt;
btn.classList.add("option");
btn.onclick = ()=>checkAnswer(i);
optionsDiv.appendChild(btn);
});

document.getElementById("score").innerText = "Score: " + score;
}

function checkAnswer(i){
let q = questions[currentCategory][index];
let buttons = document.querySelectorAll(".option");

buttons.forEach((btn,idx)=>{
if(idx === q.correct){
btn.classList.add("correct");
}
if(idx === i && i !== q.correct){
btn.classList.add("wrong");
}
});

if(i === q.correct){
score++;
}

document.getElementById("score").innerText = "Score: " + score;
}

function nextQuestion(){
index++;
if(index < questions[currentCategory].length){
loadQuestion();
}else{
alert("Quiz Finished! Your Score: " + score);
restart();
}
}

function restart(){
document.getElementById("menu").classList.remove("hidden");
document.getElementById("quiz").classList.add("hidden");
}

</script>

</body>
</html>
